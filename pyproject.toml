[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnswatch"
version = "1.0.0"
description = "🔍 DNSWatch - Lightweight Terminal DNS Query Monitor & Security Analysis Engine | 轻量级终端DNS查询监控与安全分析引擎"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "SOLO Agent", email = "solo-agent@example.com"}
]
keywords = [
    "dns", "monitor", "security", "cli", "tui", "network",
    "dns-query", "threat-detection", "performance-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed"
]
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
dnswatch = "dnswatch.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/DNSWatch"
Documentation = "https://github.com/gitstq/DNSWatch#readme"
Repository = "https://github.com/gitstq/DNSWatch.git"
Issues = "https://github.com/gitstq/DNSWatch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dnswatch*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
